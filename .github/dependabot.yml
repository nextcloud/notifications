version: 2
updates:
- package-ecosystem: composer
  directories:
    - "/"
    - "/tests/Integration"
    - "/vendor-bin/csfixer"
    - "/vendor-bin/mozart"
    - "/vendor-bin/openapi-extractor"
    - "/vendor-bin/phpunit"
    - "/vendor-bin/psalm"
    - "/vendor-bin/rector"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  cooldown:
    default-days: 10
  commit-message:
    prefix: "build"
    include: "scope"
  versioning-strategy: "increase"
  labels:
  - 3. to review
  - dependencies
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  cooldown:
    default-days: 10
  commit-message:
    prefix: "build"
    include: "scope"
  versioning-strategy: "increase"
  open-pull-requests-limit: 10
  labels:
  - 3. to review
  - dependencies
# Only performance.yml, the other workflows are synced from nextcloud/.github
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  cooldown:
    default-days: 10
  commit-message:
    prefix: "ci"
    include: "scope"
  labels:
  - 3. to review
  - dependencies
  exclude-paths:
    - ".github/workflows/block-*.yml"
    - ".github/workflows/command-*.yml"
    - ".github/workflows/dependabot-approve-merge.yml"
    - ".github/workflows/fixup.yml"
    - ".github/workflows/lint-*.yml"
    - ".github/workflows/npm-*.yml"
    - ".github/workflows/openapi.yml"
    - ".github/workflows/phpunit-*.yml"
    - ".github/workflows/pr-feedback.yml"
    - ".github/workflows/psalm.yml"
    - ".github/workflows/reuse.yml"
    - ".github/workflows/sync-workflow-templates.yml"
    - ".github/workflows/update-*.yml"

